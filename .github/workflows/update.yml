name: Kalender aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"   # täglich, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: PDF lesen und .ics erzeugen
        run: python sbv_kalender.py --out docs/sbv_wettkampfkalender.ics
      - name: Änderungen veröffentlichen
        run: |
          git config user.name "sbv-kalender-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/sbv_wettkampfkalender.ics
          if ! git diff --cached --quiet; then
            git commit -m "Kalender aktualisiert"
            git push
          elif [ -n "$(git log -1 --since='45 days ago' --format=%H)" ]; then
            echo "Keine Änderung."
          else
            # GitHub schaltet geplante Workflows nach 60 Tagen ohne Aktivität ab
            git commit --allow-empty -m "Keepalive"
            git push
          fi
